backend:
  name: git-gateway
  branch: main

locale: "es"

media_folder: "src/img/uploads"
public_folder: "/img/uploads"

collections:
  # ===== ARTÍCULOS / NOVAS =====
  - name: "posts"
    label: "📰 Artigos / Novas"
    label_singular: "Artigo"
    folder: "src/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sort: "date:desc"
    fields:
      - label: "Título"
        name: "title"
        widget: "string"
        hint: "Título do artigo"
      - label: "Data de publicación"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - "Novas"
          - "ANPA"
          - "Actividades"
          - "Extraescolares"
          - "Socios ANPA"
        default: "Novas"
        hint: "Escolla a categoría do artigo"
      - label: "Imaxe destacada"
        name: "image"
        widget: "image"
        required: false
        hint: "Opcional: imaxe para mostrar co artigo"
      - label: "Contido"
        name: "body"
        widget: "markdown"
        hint: "Escriba aquí o contido do artigo. Pode usar negriña, listas, enlaces e subir imaxes."

  # ===== PÁXINAS FIXAS =====
  - name: "pages"
    label: "📄 Páxinas fixas"
    label_singular: "Páxina"
    folder: "src/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Título"
        name: "title"
        widget: "string"
        hint: "Nome da sección (aparecerá no menú e acceso rápido)"
      - label: "URL da páxina"
        name: "permalink"
        widget: "string"
        hint: "Ex: /extraescolares/ — debe comezar e rematar con /"
      - label: "Nome curto (menú)"
        name: "navLabel"
        widget: "string"
        required: false
        hint: "Opcional: nome máis curto para o menú de arriba. Se non se pon, úsase o título."
      - label: "Icona (emoji)"
        name: "icon"
        widget: "string"
        hint: "Un emoji para o acceso rápido da portada. Ex: 📝 ⚽ 🌅 🍽️ 📊 🏛️"
        required: false
      - label: "Orde no menú"
        name: "navOrder"
        widget: "number"
        value_type: "int"
        min: 1
        max: 99
        default: 10
        hint: "Número para ordenar no menú (1 = primeiro, 99 = último)"
      - label: "Mostrar no menú e acceso rápido"
        name: "showInNav"
        widget: "boolean"
        default: true
        hint: "Desactivar para ocultar esta páxina do menú sen borrala"
      - label: "Cor da icona"
        name: "iconColor"
        widget: "select"
        options:
          - { label: "🔵 Azul", value: "blue" }
          - { label: "🟡 Dourado", value: "gold" }
          - { label: "🟢 Verde", value: "green" }
        default: "blue"
        hint: "Cor de fondo da icona no acceso rápido"
      - label: "Contido"
        name: "body"
        widget: "markdown"
        hint: "Contido da páxina. Pode usar negriña, listas, enlaces, imaxes e HTML."
    editor:
      preview: false

  # ===== XESTIÓN EXTRAESCOLARES =====
  - name: "extraescolares"
    label: "⚽ Actividades Extraescolares"
    delete: false
    files:
      - name: "config_extraescolares"
        label: "Xestión de Extraescolares"
        file: "src/_data/extraescolares.json"
        description: "Xestión de curso, horario oficial en imaxe, actividades e ligazóns"
        fields:
          - label: "Curso académico"
            name: "academic_year"
            widget: "string"
            hint: "Ex: 2026-2027. O título do horario xérase automaticamente a partir deste campo."
          - label: "Imaxe do Horario Completo"
            name: "schedule_image"
            widget: "image"
            hint: "Suba ou substitúa a imaxe oficial completa do cadro de horarios (JPG ou PNG)"
          - label: "Texto de introdución"
            name: "intro"
            widget: "text"
            required: false
          - label: "Texto de novidades"
            name: "subintro"
            widget: "text"
            required: false
          - label: "Aviso de prazos e baixas"
            name: "deadlines_note"
            widget: "text"
            required: false
          - label: "Socios e Matrícula"
            name: "membership"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Texto de alta de socio", name: "join_label", widget: "string" }
              - { label: "Ligazón alta de socio", name: "join_url", widget: "string" }
              - { label: "Nota para non socios", name: "non_member_note", widget: "text" }
              - { label: "Texto matrícula non socios", name: "non_member_label", widget: "string" }
              - { label: "Ligazón matrícula non socios", name: "non_member_url", widget: "string" }
          - label: "Listado de Actividades"
            name: "activities"
            widget: "list"
            summary: "{{fields.name}} - {{fields.stage}} ({{fields.price}})"
            fields:
              - { label: "Identificador", name: "id", widget: "string" }
              - { label: "Nome da actividade", name: "name", widget: "string" }
              - { label: "Etapa educativa", name: "stage", widget: "string" }
              - { label: "Prezo / mes", name: "price", widget: "string" }
              - { label: "Entidade / Monitor", name: "provider", widget: "string", required: false }
              - label: "Estado"
                name: "status"
                widget: "select"
                options:
                  - { label: "Normal (dispoñible segundo formulario)", value: "available" }
                  - { label: "🔴 Completa", value: "full" }
                  - { label: "🟡 Parcialmente completa", value: "partial" }
                default: "available"
              - { label: "Aviso de estado ou descrición curta", name: "status_note", widget: "string", required: false }
              - { label: "Ligazón de inscrición ou información", name: "registration_url", widget: "string", required: false }
              - { label: "Texto do botón", name: "button_label", widget: "string", required: false }
